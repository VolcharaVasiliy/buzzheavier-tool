name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build executable
        shell: pwsh
        run: .\build_exe.ps1 -PythonExe python

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuzzheavierTool-windows
          path: dist/BuzzheavierTool.exe
